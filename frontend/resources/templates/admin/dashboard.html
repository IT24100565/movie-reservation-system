<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Admin Dashboard')"></head>
<body class="bg-black">

<!-- Top Navigation Bar -->
<div th:replace="fragments/top-navbar :: top-navbar"></div>

<!-- Dashboard Content -->
<div class="container-fluid p-4">
    <!-- Welcome Section -->
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="text-white mb-1 fw-bold">Admin Dashboard</h2>
            <p class="text-muted mb-0">Welcome back, <span class="text-danger fw-semibold" th:text="${session.username}">Admin</span>!</p>
        </div>
    </div>

    <!-- Stats Cards - Simple Layout -->
    <div class="row g-4">
        <div class="col-md-4">
            <div class="admin-stats-card bg-dark text-white p-4 text-center">
                <div class="admin-stats-icon mb-3">
                    <i class="fas fa-film text-white" style="font-size: 2.5rem;"></i>
                </div>
                <h2 class="text-white mb-2 fw-bold" th:text="${movieCount ?: '0'}">0</h2>
                <p class="text-white mb-0">Total Movies</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="admin-stats-card bg-dark text-white p-4 text-center">
                <div class="admin-stats-icon mb-3">
                    <i class="fas fa-clock text-white" style="font-size: 2.5rem;"></i>
                </div>
                <h2 class="text-white mb-2 fw-bold" th:text="${showtimeCount ?: '0'}">0</h2>
                <p class="text-white mb-0">Active Showtimes</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="admin-stats-card bg-dark text-white p-4 text-center">
                <div class="admin-stats-icon mb-3">
                    <i class="fas fa-users text-white" style="font-size: 2.5rem;"></i>
                </div>
                <h2 class="text-white mb-2 fw-bold" th:text="${userCount ?: '0'}">0</h2>
                <p class="text-white mb-0">Registered Users</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
